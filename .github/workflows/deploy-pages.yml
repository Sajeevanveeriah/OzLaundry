name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install
      - run: BASE=/${{ github.event.repository.name }}/ VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.example.com' }} VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL || 'https://api.example.com' }} pnpm --filter web build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
