services:
  - type: web
    name: ozlaundry-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: QR_HMAC_SECRET
        sync: false
      - key: FEATURE_PAYMENTS
        value: "false"
